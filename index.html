<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COUNTRY EXPLORER - IBM WEB DEVEPOMENT COURSE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="assets/world.png" />
      <h1>country explorer</h1>
    </header>

    <main>
      <section>
        <form action="">
          <div>
            <label for="iCountryName">Search by CountryName</label>
            <input type="text" name="countryName" id="iCountryName" placeholder="Enter Country Name" />
          </div>
          <div>
            <label for="iRegion">Search a Region</label>
            <select name="" id="iRegion">
              <option value="none" selected>All regions</option>
            </select>
          </div>
          <div>
            <label for="iPopulation">Search by Population</label>
            <input type="number" name="population" id="iPopulation" min="0">
            <span id="iMaxPopulation">Max:</span>
          </div>
        </form>
      </section>

      <section id="coutry-cards-container"></section>

      <section>
        <button type="button" id="iShowMore">show more</button>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
